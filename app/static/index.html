<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resume Intelligence Platform</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --primary: #0f766e;
    --primary-dark: #115e59;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --track: #e2e8f0;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 24px; margin: 0 0 4px; }
  header p { color: var(--text-muted); margin: 0; font-size: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 16px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }

  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type="file"], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: var(--bg); color: var(--text);
  }
  textarea { resize: vertical; min-height: 120px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab-btn {
    padding: 6px 12px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--text-muted);
  }
  .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  .tab-btn:active { transform: scale(0.97); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--primary); color: white; border: none; border-radius: 8px;
    padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  #status { margin-top: 16px; font-size: 14px; color: var(--text-muted); }

  .banner { padding: 14px 18px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; }
  .banner.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .banner.reject { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

  .score-hero { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: conic-gradient(var(--primary) calc(var(--pct) * 1%), var(--track) 0);
    flex-shrink: 0;
  }
  .score-circle .inner {
    width: 96px; height: 96px; border-radius: 50%; background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-circle .num { font-size: 26px; font-weight: 700; }
  .score-circle .lbl { font-size: 11px; color: var(--text-muted); }

  .bars { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 140px 1fr 40px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-track { background: var(--track); border-radius: 999px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--primary); border-radius: 999px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.exact { background: #dcfce7; color: #166534; }
  .badge.semantic { background: #fef9c3; color: #854d0e; }
  .badge.none { background: #fee2e2; color: #991b1b; }
  .badge.required { background: #e0e7ff; color: #3730a3; }
  .badge.preferred { background: #f1f5f9; color: #475569; }

  .issue-row, .gap-row, .rec-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .issue-row:last-child, .gap-row:last-child, .rec-row:last-child { border-bottom: none; }
  .sev, .prio { font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; margin-right: 8px; }
  .sev.high, .prio.critical { background: #fee2e2; color: #991b1b; }
  .sev.medium, .prio.high { background: #ffedd5; color: #9a3412; }
  .sev.low, .prio.medium { background: #fef9c3; color: #854d0e; }
  .prio.low { background: #e0e7ff; color: #3730a3; }
  .rec-row .title { font-weight: 600; }
  .rec-row .detail, .gap-row .detail { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

  .steps-list { display: flex; flex-direction: column; gap: 2px; }
  .step-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
  .step-icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .step-row.done .step-icon { color: var(--success); }
  .step-row.done span.label { color: var(--text); }
  .step-row.active .step-icon .pulse-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--primary);
    display: inline-block; animation: pulse-dot 1.1s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(0.7); }
  }
  .step-row.active span.label { color: var(--primary); font-weight: 600; }
  .step-row.pending { opacity: .45; }
  .step-row.pending .step-icon { color: var(--text-muted); }

  .why-row td { padding: 0 6px 10px; border-bottom: 1px solid var(--border); }
  .why-row .why-text { font-size: 12px; color: var(--text-muted); font-style: italic; padding-left: 2px; }

  .reasoning-note { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 6px; padding-left: 152px; }
  @media (max-width: 600px) { .reasoning-note { padding-left: 0; } }

  .classif-row { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .classif-row:last-child { border-bottom: none; }
  .classif-row .doc-type { font-weight: 600; }
  .classif-row .reason { color: var(--text-muted); flex: 1; text-align: right; }

  #results { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Resume Intelligence Platform</h1>
    <p>Upload a resume and a job description to get an explainable match score, gap analysis, and recommendations.</p>
  </header>

  <div class="card">
    <h2>1. Resume</h2>
    <label for="resumeFile">Resume file (PDF or DOCX)</label>
    <input type="file" id="resumeFile" accept=".pdf,.docx" />
  </div>

  <div class="card">
    <h2>2. Job Description</h2>
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="paste">Paste text</button>
      <button type="button" class="tab-btn" data-tab="upload">Upload file</button>
    </div>
    <div class="tab-pane active" id="tab-paste">
      <textarea id="jdText" placeholder="Paste the job description here..."></textarea>
    </div>
    <div class="tab-pane" id="tab-upload">
      <label for="jdFile">JD file (PDF, DOCX, or TXT)</label>
      <input type="file" id="jdFile" accept=".pdf,.docx,.txt" />
    </div>
  </div>

  <button class="btn" id="analyzeBtn" type="button">Analyze fit</button>
  <div id="status"></div>

  <div class="card" id="stepsCard" style="display:none; margin-top: 20px;">
    <h2>Pipeline Progress</h2>
    <div class="steps-list" id="stepsList"></div>
  </div>

  <div id="resultsWrap" style="margin-top: 28px;"></div>
</div>

<script>
const tabButtons = document.querySelectorAll('.tab-btn');
tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    tabButtons.forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  children.forEach(c => node.appendChild(c));
  return node;
}

function scoreBar(label, value) {
  const row = el('div', { class: 'bar-row' });
  row.appendChild(el('div', { text: label }));
  const track = el('div', { class: 'bar-track' });
  track.appendChild(el('div', { class: 'bar-fill', style: `width:${value}%` }));
  row.appendChild(track);
  row.appendChild(el('div', { text: Math.round(value) + '%' }));
  return row;
}

const STEP_ICONS = {
  done: '✓',
  active: '',
  pending: '○',
};

function renderSteps(steps) {
  const card = document.getElementById('stepsCard');
  const list = document.getElementById('stepsList');
  card.style.display = 'block';
  list.innerHTML = '';
  steps.forEach(step => {
    const row = el('div', { class: 'step-row ' + step.state });
    const icon = el('div', { class: 'step-icon' });
    if (step.state === 'active') {
      icon.appendChild(el('span', { class: 'pulse-dot' }));
    } else {
      icon.textContent = STEP_ICONS[step.state];
    }
    row.appendChild(icon);
    row.appendChild(el('span', { class: 'label', text: step.label }));
    list.appendChild(row);
  });
}

function renderResults(result) {
  const wrap = document.getElementById('resultsWrap');
  wrap.innerHTML = '';

  // Document classification: why each document was accepted
  const classifCard = el('div', { class: 'card' });
  classifCard.appendChild(el('h2', { text: 'Document Classification' }));
  [
    ['Resume', result.resume_classification],
    ['Job Description', result.jd_classification],
  ].forEach(([label, c]) => {
    const row = el('div', { class: 'classif-row' });
    row.appendChild(el('span', {}, [
      el('span', { class: 'doc-type', text: `${label}: ${c.document_type} (${Math.round(c.confidence * 100)}% confidence)` }),
    ]));
    row.appendChild(el('span', { class: 'reason', text: c.reason }));
    classifCard.appendChild(row);
  });
  wrap.appendChild(classifCard);

  // Score hero
  const mb = result.match_breakdown;
  const scoreCard = el('div', { class: 'card' });
  scoreCard.appendChild(el('h2', { text: 'Overall Match' }));
  const hero = el('div', { class: 'score-hero' });
  const circle = el('div', { class: 'score-circle' });
  circle.style.setProperty('--pct', mb.overall_score);
  const inner = el('div', { class: 'inner' });
  inner.appendChild(el('div', { class: 'num', text: Math.round(mb.overall_score) + '%' }));
  inner.appendChild(el('div', { class: 'lbl', text: 'overall' }));
  circle.appendChild(inner);
  hero.appendChild(circle);
  const bars = el('div', { class: 'bars' });
  bars.appendChild(scoreBar('Skill match', mb.skill_match));
  bars.appendChild(scoreBar('Experience', mb.experience_match));
  bars.appendChild(scoreBar('Responsibilities', mb.responsibility_match));
  bars.appendChild(scoreBar('Keyword coverage', mb.keyword_coverage));
  bars.appendChild(scoreBar('Qualifications', mb.qualification_match));
  bars.appendChild(scoreBar('ATS compatibility', mb.ats_compatibility));
  hero.appendChild(bars);
  scoreCard.appendChild(hero);

  const qm = result.qualitative_match;
  if (qm) {
    scoreCard.appendChild(el('div', {
      class: 'reasoning-note',
      text: `Responsibilities: ${qm.responsibility_reasoning}`,
    }));
    scoreCard.appendChild(el('div', {
      class: 'reasoning-note',
      text: `Qualifications: ${qm.qualification_reasoning}`,
    }));
  }
  wrap.appendChild(scoreCard);

  // Two-column: skill matches + ATS
  const grid = el('div', { class: 'grid-2' });

  const skillCard = el('div', { class: 'card' });
  skillCard.appendChild(el('h2', { text: 'Skill Matches' }));
  const table = el('table');
  const thead = el('tr');
  ['Skill', 'Type', 'Match', ''].forEach(h => thead.appendChild(el('th', { text: h })));
  table.appendChild(thead);
  result.skill_matches.forEach(m => {
    const tr = el('tr');
    tr.appendChild(el('td', { text: m.required_skill }));
    tr.appendChild(el('td', {}, [el('span', { class: 'badge ' + m.importance, text: m.importance })]));
    tr.appendChild(el('td', {}, [el('span', { class: 'badge ' + m.match_type, text: m.match_type })]));
    tr.appendChild(el('td', { text: m.matched_resume_skill || '-' }));
    table.appendChild(tr);

    if (m.reasoning && m.match_type !== 'exact') {
      const whyTr = el('tr', { class: 'why-row' });
      const whyTd = el('td', { colspan: '4' });
      whyTd.appendChild(el('div', { class: 'why-text', text: `Why: ${m.reasoning}` }));
      whyTr.appendChild(whyTd);
      table.appendChild(whyTr);
    }
  });
  skillCard.appendChild(table);
  grid.appendChild(skillCard);

  const atsCard = el('div', { class: 'card' });
  atsCard.appendChild(el('h2', { text: `ATS Analysis (${Math.round(result.ats_analysis.score)}%)` }));
  if (result.ats_analysis.issues.length === 0) {
    atsCard.appendChild(el('p', { text: 'No ATS issues detected.', style: 'color:var(--text-muted);font-size:13px;' }));
  }
  result.ats_analysis.issues.forEach(issue => {
    const row = el('div', { class: 'issue-row' });
    row.appendChild(el('span', { class: 'sev ' + issue.severity, text: issue.severity }));
    row.appendChild(el('span', { text: issue.issue }));
    atsCard.appendChild(row);
  });
  grid.appendChild(atsCard);
  wrap.appendChild(grid);

  // Gaps
  const gapCard = el('div', { class: 'card' });
  gapCard.appendChild(el('h2', { text: 'Gaps' }));
  if (result.gaps.length === 0) {
    gapCard.appendChild(el('p', { text: 'No significant gaps found.', style: 'color:var(--text-muted);font-size:13px;' }));
  }
  result.gaps.forEach(g => {
    const row = el('div', { class: 'gap-row' });
    row.appendChild(el('div', { class: 'title', text: `[${g.category}] ${g.description}` }));
    row.appendChild(el('div', { class: 'detail', text: g.recommendation }));
    gapCard.appendChild(row);
  });
  wrap.appendChild(gapCard);

  // Recommendations
  const recCard = el('div', { class: 'card' });
  recCard.appendChild(el('h2', { text: 'Recommendations' }));
  result.recommendations.forEach(r => {
    const row = el('div', { class: 'rec-row' });
    const titleRow = el('div');
    titleRow.appendChild(el('span', { class: 'prio ' + r.priority, text: r.priority }));
    titleRow.appendChild(el('span', { class: 'title', text: r.title }));
    row.appendChild(titleRow);
    row.appendChild(el('div', { class: 'detail', text: r.detail }));
    recCard.appendChild(row);
  });
  wrap.appendChild(recCard);
}

function renderBanner(className, text) {
  const wrap = document.getElementById('resultsWrap');
  wrap.innerHTML = '';
  wrap.appendChild(el('div', { class: 'banner ' + className, text }));
}

const POLL_INTERVAL_MS = 700;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function pollJob(jobId) {
  while (true) {
    const resp = await fetch(`/analysis/${jobId}`);
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      throw new Error(data.detail || `Polling failed (${resp.status})`);
    }
    const data = await resp.json();
    renderSteps(data.steps);

    if (data.status === 'completed') return { kind: 'completed', result: data.result };
    if (data.status === 'rejected') return { kind: 'rejected', reason: data.reason };
    if (data.status === 'failed') return { kind: 'failed', error: data.error };

    await sleep(POLL_INTERVAL_MS);
  }
}

document.getElementById('analyzeBtn').addEventListener('click', async () => {
  const resumeFile = document.getElementById('resumeFile').files[0];
  const jdText = document.getElementById('jdText').value.trim();
  const jdFile = document.getElementById('jdFile').files[0];
  const activeTab = document.querySelector('.tab-btn.active').dataset.tab;

  const status = document.getElementById('status');
  const btn = document.getElementById('analyzeBtn');

  if (!resumeFile) { status.textContent = 'Please choose a resume file.'; return; }
  if (activeTab === 'paste' && !jdText) { status.textContent = 'Please paste a job description.'; return; }
  if (activeTab === 'upload' && !jdFile) { status.textContent = 'Please choose a JD file.'; return; }

  const formData = new FormData();
  formData.append('resume_file', resumeFile);
  if (activeTab === 'paste') formData.append('jd_text', jdText);
  else formData.append('jd_file', jdFile);

  btn.disabled = true;
  status.textContent = 'Starting analysis...';
  document.getElementById('resultsWrap').innerHTML = '';
  document.getElementById('stepsCard').style.display = 'none';

  try {
    const startResp = await fetch('/analysis/start', { method: 'POST', body: formData });
    const startData = await startResp.json();
    if (!startResp.ok) {
      renderBanner('error', `Error: ${startData.detail || startResp.statusText}`);
      status.textContent = '';
      return;
    }

    status.textContent = '';
    const outcome = await pollJob(startData.job_id);

    if (outcome.kind === 'rejected') {
      renderBanner('reject', `Rejected: ${outcome.reason}`);
    } else if (outcome.kind === 'failed') {
      renderBanner('error', `Analysis failed: ${outcome.error}`);
    } else {
      renderResults(outcome.result);
    }
  } catch (err) {
    renderBanner('error', `Request failed: ${err.message}`);
    status.textContent = '';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
