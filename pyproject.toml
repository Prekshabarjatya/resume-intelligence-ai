[project]
name = "resume-intelligence-platform"
version = "0.1.0"
description = "Agentic Resume Intelligence & Optimization Platform - core agent pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-dateutil>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
